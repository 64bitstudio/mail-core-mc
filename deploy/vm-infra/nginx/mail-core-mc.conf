# Ticket 011: vhost de nginx para los 3 subdominios de mail-core-mc.
# Subdominio base decidido por Marco: mailcore.64bitstudio.com (NO
# mail.64bitstudio.com -- ese ya es el hostname del MTA, ticket 001/009,
# no reusable). Los sufijos -qa/-dev siguen el mismo patrón ya
# establecido por auth-core-mc (ticket 049) -- único patrón que existe
# en este ecosistema para 3 subdominios por proyecto, no una decisión
# nueva: mailcore.64bitstudio.com (PROD) / mailcore-qa.64bitstudio.com
# (QA) / mailcore-dev.64bitstudio.com (DEV).
#
# Misma topología que auth-core-mc.conf: nginx de fábrica de la VM en
# 80/443, Traefik puertas adentro en 127.0.0.1:8000 (ver
# docs/ARQUITECTURA.md, auth-core-mc ticket 049, para el porqué completo
# de esta decisión de Marco).
#
# Solo HTTP por ahora (puerto 80) -- SIN bloque 443/ssl todavía: requiere
# que los 3 registros DNS (mailcore[.-qa][-dev].64bitstudio.com) ya
# existan y resuelvan antes de correr certbot (ver
# certbotDomains en el Jenkinsfile -- corePipeline lo corre automático
# en cada deploy a dev, tolerante a fallo si el DNS aún no está listo).
#
# nginx reenvía TODO (incluida cualquier ruta /.well-known/acme-challenge/
# que certbot necesite) al Traefik interno.
server {
    listen 80;
    listen [::]:80;
    server_name mailcore.64bitstudio.com mailcore-qa.64bitstudio.com mailcore-dev.64bitstudio.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
